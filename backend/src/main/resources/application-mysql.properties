# Perfil MySQL: ejecutar con --spring.profiles.active=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/geofastpe?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false

spring.application.name=GeoFastPe
server.port=${SERVER_PORT:8080}

# ==========================
# Base de datos
# Por defecto H2 en archivo para desarrollo (no requiere MySQL).
# Para MySQL: --spring.profiles.active=mysql
# ==========================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/geofastpe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# JWT (24h por defecto)
# ==========================
app.jwt.secret=${JWT_SECRET:geofastpe-dev-secret-change-me-please-32bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================
# OTP
# provider: log | textbelt | twilio
# ==========================
app.otp.provider=${OTP_PROVIDER:log}
app.otp.ttl-seconds=${OTP_TTL_SECONDS:300}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.expose-code=${OTP_EXPOSE_CODE:true}

# Twilio (sms real con credito de prueba)
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}

# Textbelt (sms real gratuito, 1 envio por dia con la key "textbelt")
app.textbelt.key=${TEXTBELT_KEY:textbelt}

# ==========================
# CORS
# ==========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# ==========================
# Administrador inicial (se promueve al arrancar si el telefono existe)
# ==========================
app.admin.phone=${ADMIN_PHONE:}

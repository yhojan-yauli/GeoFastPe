spring.application.name=GeoFastPe
server.port=${SERVER_PORT:8080}

# ==========================
# Base de datos
# Por defecto H2 en archivo para desarrollo (no requiere MySQL).
# Para MySQL: --spring.profiles.active=mysql
# ==========================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/geofastpe;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================
# JWT (24h por defecto)
# ==========================
app.jwt.secret=${JWT_SECRET:geofastpe-dev-secret-change-me-please-32bytes-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================
# CORS
# ==========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# ==========================
# Archivos (imagenes subidas por la app)
# ==========================
app.storage.upload-dir=${UPLOAD_DIR:uploads}
app.storage.max-file-size-bytes=${MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ==========================
# Servicios externos (proxies /api/v1/geo)
# ==========================
app.geo.nominatim-base-url=${GEO_NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.geo.open-meteo-base-url=${GEO_OPEN_METEO_URL:https://api.open-meteo.com}
app.geo.routing-base-url=${GEO_ROUTING_URL:https://routing.openstreetmap.de}
app.geo.user-agent=GeoFastPe/1.0 (proyecto academico)

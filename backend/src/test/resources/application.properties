spring.datasource.url=jdbc:h2:mem:geofastpe-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.jwt.secret=test-secret-key-with-at-least-32-characters!!
app.jwt.expiration-ms=3600000

app.otp.provider=log
app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=0
app.otp.expose-code=true

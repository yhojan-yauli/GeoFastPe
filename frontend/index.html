<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#191632" />
    <title>GeoFastPe</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // En desarrollo se eliminan Service Workers antiguos para no servir código obsoleto.
      if ('serviceWorker' in navigator && (location.port === '5173' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            registrations.forEach(function (registration) { registration.unregister(); });
            if (window.caches && caches.keys) {
              caches.keys().then(function (keys) { keys.forEach(function (key) { caches.delete(key); }); });
            }
          })
          .catch(function () {});
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
